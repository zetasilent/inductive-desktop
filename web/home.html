<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src 'self' data:; connect-src 'none'">
<title>Inductive · Home</title>
<style>
:root{
  --bg:#000;--raised:#0c0c0c;--hover:#171717;--line:#222;--line-strong:#333;
  --text:#e6e6e6;--dim:#9b9b9b;--faint:#6c6c6c;--focus:#5b8cff;--warn:#e0a458;--error:#f08a7a;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
main{max-width:780px;margin:0 auto;padding:44px 32px 64px}

/* top bar */
header{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.mark{width:30px;height:11px;flex:none}
.word{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1}
.link{color:var(--dim);font-size:12px;padding:4px 6px;border-radius:5px}
.link:hover:not(:disabled){color:var(--text);background:var(--hover)}

/* the three things you came here to do */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;
  padding:12px 12px 11px;border:1px solid var(--line);border-radius:7px;background:var(--raised)}
.tile:hover:not(:disabled){background:var(--hover);border-color:var(--line-strong)}
.tile svg{color:var(--dim)}
.tile span{font-weight:500}
.status{min-height:18px;margin:10px 0 0;font-size:12px;color:var(--dim);white-space:pre-wrap;overflow-wrap:anywhere}
.status.error{color:var(--error)}
.hint{color:var(--dim);margin:0 0 22px}

/* sections */
section{margin-top:30px}
.head{display:flex;align-items:center;gap:10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
h2{flex:1;margin:0;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.01em}
h2 .n{font-weight:400;color:var(--faint);margin-left:6px;font-variant-numeric:tabular-nums}
input[type=search],input[type=text]{background:var(--raised);border:1px solid var(--line);border-radius:5px;
  padding:4px 8px;height:26px;min-width:0;color:var(--text)}
input::placeholder{color:var(--faint)}
input[type=search]{width:200px}
input:focus{outline:none;border-color:var(--focus)}
input[type=checkbox]{accent-color:var(--focus);margin:0;flex:none}
.icon{display:grid;place-items:center;width:26px;height:26px;border-radius:5px;color:var(--dim)}
.icon:hover:not(:disabled){background:var(--hover);color:var(--text)}

/* project rows: the whole row opens the project */
.rows{display:flex;flex-direction:column;padding-top:4px}
.project{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;align-items:baseline;
  gap:14px;width:100%;text-align:left;padding:6px 8px;margin:0 -8px;border-radius:5px;width:calc(100% + 16px)}
.project:hover:not(:disabled){background:var(--hover)}
.project .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path{font:12px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.path bdi{direction:ltr;unicode-bidi:isolate}
.kind{font-size:12px;color:var(--faint);white-space:nowrap}
.project.missing .kind{color:var(--warn)}
.project:disabled{opacity:1}
.project:disabled .name{color:var(--dim)}
.empty{color:var(--dim);padding:12px 0}
.more{color:var(--faint);font-size:12px;padding:8px 0 0}

/* import results: same rows, with a checkbox */
.box{margin-top:16px;border:1px solid var(--line-strong);border-radius:7px;background:var(--raised)}
.box-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.box-head strong{flex:1;font-weight:600;overflow-wrap:anywhere}
.box-body{padding:4px 12px}
.box-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.box-foot .spacer{flex:1}
.scroll{max-height:320px;overflow:auto}
label.project{grid-template-columns:auto minmax(0,180px) minmax(0,1fr);cursor:pointer}
.btn{height:26px;padding:0 11px;border-radius:5px;border:1px solid var(--line-strong);background:var(--hover);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:#242424}
.btn.primary{background:var(--text);border-color:var(--text);color:#111}
.btn.primary:hover:not(:disabled){background:#fff}
.small{font-size:12px;color:var(--dim);margin:0}


@media(max-width:520px){
  main{padding:28px 18px 48px}
  .tiles{grid-template-columns:1fr}
  .tile{flex-direction:row;align-items:center;gap:10px}
  .head{flex-wrap:wrap}
  input[type=search]{width:100%;order:3}
  .project{grid-template-columns:minmax(0,1fr) auto;row-gap:1px}
  .project .path{grid-column:1/-1;grid-row:2}
  label.project{grid-template-columns:auto minmax(0,1fr)}
  label.project .path{grid-column:2}
}
@media(prefers-reduced-motion:reduce){.coil-current{animation:none!important}}
</style></head><body><main>

<header>
  <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" fill="none" aria-hidden="true">
    <style>@keyframes t{from{stroke-dashoffset:116}to{stroke-dashoffset:0}}.coil-current{animation:t 2.6s linear infinite}</style>
    <path d="M 0 55 H 26.7 C 28.9 42.3 34.4 29.8 42.1 20.8 C 49.8 11.9 59.8 6.7 69.8 6.7 C 79.8 6.7 89.8 11.9 97.5 20.8 C 105.2 29.8 110.7 42.3 112.9 55 C 115.2 67.7 114.3 80.2 111 89.2 C 107.8 98.1 102.3 103.3 96.8 103.3 C 91.3 103.3 85.9 98.1 82.6 89.2 C 79.4 80.2 78.4 67.7 80.7 55 C 82.9 42.3 88.4 29.8 96.1 20.8 C 103.9 11.9 113.8 6.7 123.8 6.7 C 133.8 6.7 143.8 11.9 151.5 20.8 C 159.3 29.8 164.7 42.3 167 55 C 169.2 67.7 168.3 80.2 165.1 89.2 C 161.8 98.1 156.4 103.3 150.9 103.3 C 145.3 103.3 139.9 98.1 136.7 89.2 C 133.4 80.2 132.5 67.7 134.7 55 C 137 42.3 142.4 29.8 150.2 20.8 C 157.9 11.9 167.9 6.7 177.9 6.7 C 187.9 6.7 197.8 11.9 205.6 20.8 C 213.3 29.8 218.8 42.3 221 55 C 223.3 67.7 222.3 80.2 219.1 89.2 C 215.9 98.1 210.4 103.3 204.9 103.3 C 199.4 103.3 193.9 98.1 190.7 89.2 C 187.5 80.2 186.5 67.7 188.8 55 C 191 42.3 196.5 29.8 204.2 20.8 C 211.9 11.9 221.9 6.7 231.9 6.7 C 241.9 6.7 251.9 11.9 259.6 20.8 C 267.4 29.8 272.8 42.3 275 55 H 300" stroke="#E6E6E6" stroke-width="9" stroke-linecap="round"/>
    <path class="coil-current" d="M 0 55 H 26.7 C 28.9 42.3 34.4 29.8 42.1 20.8 C 49.8 11.9 59.8 6.7 69.8 6.7 C 79.8 6.7 89.8 11.9 97.5 20.8 C 105.2 29.8 110.7 42.3 112.9 55 C 115.2 67.7 114.3 80.2 111 89.2 C 107.8 98.1 102.3 103.3 96.8 103.3 C 91.3 103.3 85.9 98.1 82.6 89.2 C 79.4 80.2 78.4 67.7 80.7 55 C 82.9 42.3 88.4 29.8 96.1 20.8 C 103.9 11.9 113.8 6.7 123.8 6.7 C 133.8 6.7 143.8 11.9 151.5 20.8 C 159.3 29.8 164.7 42.3 167 55 C 169.2 67.7 168.3 80.2 165.1 89.2 C 161.8 98.1 156.4 103.3 150.9 103.3 C 145.3 103.3 139.9 98.1 136.7 89.2 C 133.4 80.2 132.5 67.7 134.7 55 C 137 42.3 142.4 29.8 150.2 20.8 C 157.9 11.9 167.9 6.7 177.9 6.7 C 187.9 6.7 197.8 11.9 205.6 20.8 C 213.3 29.8 218.8 42.3 221 55 C 223.3 67.7 222.3 80.2 219.1 89.2 C 215.9 98.1 210.4 103.3 204.9 103.3 C 199.4 103.3 193.9 98.1 190.7 89.2 C 187.5 80.2 186.5 67.7 188.8 55 C 191 42.3 196.5 29.8 204.2 20.8 C 211.9 11.9 221.9 6.7 231.9 6.7 C 241.9 6.7 251.9 11.9 259.6 20.8 C 267.4 29.8 272.8 42.3 275 55 H 300" pathLength="100" stroke="#FF4A1C" stroke-width="9" stroke-linecap="round" stroke-dasharray="16 100"/>
  </svg>
  <span class="word">Inductive</span>
  <button class="link" id="skip">Skip setup</button>
</header>

<p class="hint" id="welcome" hidden>Import a folder of KiCad projects, open one, or start a new one.</p>

<div class="tiles">
  <button class="tile" id="import">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 4.2v8.1c0 .6.5 1.1 1.1 1.1h10.2c.6 0 1.1-.5 1.1-1.1V6.1c0-.6-.5-1.1-1.1-1.1H8L6.6 3.1H2.9c-.6 0-1.1.5-1.1 1.1z"/><path d="M8 7.2v4M6.2 9.5L8 11.3l1.8-1.8"/></svg>
    <span>Import KiCad projects</span>
  </button>
  <button class="tile" id="open">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 12.3V4.2c0-.6.5-1.1 1.1-1.1h3.7L8 5h5.1c.6 0 1.1.5 1.1 1.1v1"/><path d="M1.8 12.3l1.9-4.6c.2-.4.6-.7 1-.7h10.1l-2 5.3c-.2.4-.5.7-1 .7H2.9c-.6 0-1.1-.3-1.1-.7z"/></svg>
    <span>Open project</span>
  </button>
  <button class="tile" id="new">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M8 5.2v5.6M5.2 8h5.6"/></svg>
    <span>New project</span>
  </button>
</div>
<p id="status" class="status" role="status" aria-live="polite"></p>

<section id="scanPanel" class="box" hidden aria-label="Import KiCad projects">
  <div class="box-head"><strong id="scanSummary">Searching…</strong><button class="btn" id="cancelScan" hidden>Cancel search</button></div>
  <div id="scanControls" hidden>
    <div class="box-body scroll"><div id="results" class="rows"></div></div>
    <div class="box-foot">
      <button class="btn" id="selectAll">Select all</button>
      <button class="btn" id="selectNone">Select none</button>
      <span class="spacer"></span>
      <button class="btn" id="dismissScan">Close</button>
      <button class="btn primary" id="importSelected">Import selected</button>
    </div>
  </div>
  <p class="small" style="padding:0 12px 10px" id="scanNote">Projects stay where they are; the library keeps a link to each.</p>
</section>

<section aria-label="Project library">
  <div class="head">
    <h2>Projects<span class="n" id="count"></span></h2>
    <input id="search" type="search" placeholder="Find a project" aria-label="Search projects">
    <button class="icon" id="refresh" title="Refresh library" aria-label="Refresh library">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.3 8A5.3 5.3 0 1 1 11.7 4.2"/><path d="M13.4 2.4v3.2h-3.2"/></svg>
    </button>
  </div>
  <div id="projects" class="rows"></div>
</section>


</main><script>
(function(){'use strict';
var entries=[],found=[],selected=new Set(),scanning=false,pending=false;
function $(id){return document.getElementById(id)}
function node(tag,text,cls){var n=document.createElement(tag);n.textContent=text||'';if(cls)n.className=cls;return n}
function status(text,error){$('status').textContent=text||'';$('status').classList.toggle('error',!!error)}
/* Paths read right-to-left so the end (the folder and file) survives truncation. */
function pathNode(path){var s=node('span','','path'),b=node('bdi',String(path).replace(/^\/Users\/[^/]+/,'~'));s.title=path;s.appendChild(b);return s}
function controls(){
  ['import','open','new','refresh','importSelected','skip'].forEach(function(id){$(id).disabled=scanning||pending});
  $('importSelected').disabled=scanning||pending||!selected.size;
  $('importSelected').textContent='Import '+selected.size+' selected';
  document.querySelectorAll('.open-project').forEach(function(b){b.disabled=scanning||pending||b.dataset.missing==='true'})}
function send(data){if(window.inductiveHost&&window.inductiveHost.postMessage){window.inductiveHost.postMessage(JSON.stringify(data));return true}status('Open Home inside the Inductive app to continue.',true);return false}
function action(data){status('');pending=true;controls();if(!send(data)){pending=false;controls()}}
function kind(p){
  if(p.missing)return 'Missing, locate with Open project';
  var parts=[p.schematic?'Schematic':'',p.pcb?'PCB':''].filter(Boolean).join(' + ');
  return (p.legacy?'Legacy, converts on save':'')+(p.legacy&&parts?', ':'')+parts}
function renderProjects(){
  var list=$('projects');list.textContent='';var q=$('search').value.toLowerCase();
  var matches=entries.filter(function(p){return(p.name+' '+p.path).toLowerCase().includes(q)});
  $('count').textContent=entries.length?String(entries.length):'';
  if(!matches.length){list.appendChild(node('p',entries.length?'No projects match “'+$('search').value+'”.':'No projects yet. Import a folder of KiCad projects, or open one.','empty'));controls();return}
  matches.slice(0,500).forEach(function(p){
    var row=node('button','','project open-project'+(p.missing?' missing':''));
    row.dataset.missing=String(!!p.missing);
    row.appendChild(node('span',p.name,'name'));row.appendChild(pathNode(p.path));row.appendChild(node('span',kind(p),'kind'));
    row.setAttribute('aria-label','Open '+p.name+' at '+p.path);
    row.onclick=function(){action({type:'home_open',path:p.path})};
    list.appendChild(row)});
  if(matches.length>500)list.appendChild(node('p','Showing 500 of '+matches.length+'. Search to narrow the list.','more'));
  controls()}
function renderResults(){
  var list=$('results');list.textContent='';
  found.forEach(function(p){
    var row=node('label','','project'),c=node('input');c.type='checkbox';c.checked=selected.has(p.path);
    c.setAttribute('aria-label','Import '+p.name+' at '+p.path);
    c.onchange=function(){if(c.checked)selected.add(p.path);else selected.delete(p.path);controls()};
    row.appendChild(c);row.appendChild(node('span',p.name,'name'));row.appendChild(pathNode(p.path));list.appendChild(row)});
  controls()}
$('import').onclick=function(){action({type:'home_scan'})};
$('cancelScan').onclick=function(){send({type:'home_cancel'});$('cancelScan').disabled=true};
$('open').onclick=function(){action({type:'home_open'})};
$('new').onclick=function(){send({type:'home_new'})};
$('refresh').onclick=function(){action({type:'home_refresh'})};
$('skip').onclick=function(){action({type:'home_complete'})};
$('selectAll').onclick=function(){found.forEach(function(p){selected.add(p.path)});renderResults()};
$('selectNone').onclick=function(){selected.clear();renderResults()};
$('dismissScan').onclick=function(){$('scanPanel').hidden=true};
$('importSelected').onclick=function(){action({type:'home_import',paths:Array.from(selected)})};
$('search').oninput=renderProjects;
window.inductiveDeliver=function(ev){
  if(ev.type==='home_state'){pending=false;entries=ev.projects||[];$('skip').hidden=!!ev.onboarded;$('welcome').hidden=!!ev.onboarded&&entries.length>0;renderProjects();controls()}
  else if(ev.type==='home_scanning'){pending=false;scanning=true;$('scanPanel').hidden=false;$('scanControls').hidden=true;$('cancelScan').hidden=false;$('cancelScan').disabled=false;$('scanSummary').textContent='Searching '+ev.root+'…';status('');controls()}
  else if(ev.type==='home_scan'){scanning=false;pending=false;found=ev.projects||[];selected=new Set(found.map(function(p){return p.path}));$('cancelScan').hidden=true;$('scanControls').hidden=false;
    $('scanSummary').textContent=(ev.cancelled?'Search cancelled. ':'')+found.length+(found.length===1?' project':' projects')+' in '+ev.root+(ev.limited?'. Search limit reached; choose a smaller folder for the rest.':'')+(ev.skipped?'. '+ev.skipped+(ev.skipped===1?' unreadable entry':' unreadable entries')+' skipped.':'');renderResults()}
  else if(ev.type==='home_imported'){pending=false;$('scanPanel').hidden=true;status('Imported '+ev.count+(ev.count===1?' project':' projects')+'. The files stay where they are.');controls()}
  else if(ev.type==='home_error'||ev.type==='home_cancelled'){pending=false;scanning=false;$('cancelScan').hidden=true;if(ev.message)status(ev.message,true);controls()}};
renderProjects();
})();</script></body></html>

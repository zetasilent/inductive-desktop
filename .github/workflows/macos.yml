# Builds Inductive.app for Apple Silicon Macs running macOS 14 and later, which every
# Apple Silicon Mac can run. Homebrew's libraries match the macOS they are installed on,
# and the app bundles them, so the build runs on a macOS 14 machine.
#
# No secrets: the app comes out unsigned (ad hoc) and without server settings, and is
# signed and notarized elsewhere (tools/adopt-macos-build.sh, then tools/make-dmg.sh).
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 16 (it still builds for macOS 14)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build for macOS 14
        run: tools/build-macos.sh "$RUNNER_TEMP/build" 14.0

      - name: Package the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/build/kicad-mac-builder/build/kicad-dest/Inductive.app" \
            "$RUNNER_TEMP/Inductive-macos14-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Inductive-macos14-arm64
          path: ${{ runner.temp }}/Inductive-macos14-arm64.zip
          retention-days: 14
          compression-level: 0
